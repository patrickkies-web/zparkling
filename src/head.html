<title>zparkling</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800;900&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: a website that fills the window on every device; phones see it edge to edge, wider screens keep the content in a centered column. Single dark look by choice. */
:root {
  --page: #0C0A1A; --ink: #15122B; --surface: #211D3D; --surface-2: #2C2750; --sel: #2B2652; --line: #312C58; --line-2: #3A3463;
  --text: #F4F1FF; --white: #FFFFFF; --muted: #ABA4D4; --orange: #FF7A45; --mint: #48D9A6; --violet: #9886FF; --violet-text: #B3A6FF;
  --sun: #FFC940; --accent: #FF7A45; --danger: #FF8A73; --pink: #FF8FC4;
  --display: 'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --top: 44px; --bottom: 22px;
  /* side gutter: 20px on a phone; on a laptop or tablet the content stays in a centered column of --col and the page runs to the window edges */
  --col: 560px; --gx: max(20px, calc((100% - var(--col)) / 2));
  color-scheme: dark;
}
html, body { height: 100%; background: var(--page); color: var(--text); }
body { font-family: var(--body); overflow: hidden; }
* { -webkit-tap-highlight-color: transparent; }
button, input, textarea { font-family: inherit; }
button { cursor: pointer; }
/* the iPhone gives buttons and fields its own padding, font and look; these are Chromium's defaults, so every phone shows the same */
:where(button) { -webkit-appearance: none; appearance: none; padding: 1px 6px; font-size: 13.3333px; border-radius: 0; }
:where(input:not([type]), input[type="text"], input[type="number"], input[type="search"], input[type="tel"], input[type="email"], input[type="url"], textarea) { -webkit-appearance: none; appearance: none; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { height: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: center; padding-block: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { position: relative; flex: 0 0 auto; }
.device { position: absolute; top: 0; left: 0; width: 410px; height: 864px; box-sizing: border-box; padding: 10px; border-radius: 56px; background: #05040D; box-shadow: 0 0 0 2px #2A2650, 0 40px 90px rgba(0,0,0,.55); transform-origin: top left; }
#app { position: relative; width: 100%; height: 100%; border-radius: 46px; overflow: hidden; background: var(--ink); color: var(--text); font-size: 14px; }
body.full .shell { padding: 0; }
body.full .wrap { position: fixed; inset: 0; width: auto !important; height: auto !important; }
body.full .device { position: absolute; inset: 0; width: auto; height: auto; padding: 0; border-radius: 0; box-shadow: none; transform: none !important; }
body.full #app { border-radius: 0; }
body.full { --top: calc(env(safe-area-inset-top, 0px) + 14px); --bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }

.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--ink); }
.head { flex: 0 0 auto; padding: var(--top) var(--gx) 0; }
.body { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px var(--gx) 24px; scrollbar-width: none; }
.body::-webkit-scrollbar { display: none; }
.foot { flex: 0 0 auto; padding: 10px var(--gx) var(--bottom); display: flex; flex-direction: column; gap: 10px; background: linear-gradient(to top, var(--ink) 75%, rgba(21,18,43,0)); }
.scr.welcome .body { padding-top: var(--top); display: flex; flex-direction: column; justify-content: center; }
:where(.scr) :where(h1, h2, h3, p) { margin: 0; }

.ic { display: block; flex: 0 0 auto; }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }
.gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap10 { gap: 10px; } .gap14 { gap: 14px; }
.mt6 { margin-top: 6px; } .mt8 { margin-top: 8px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; } .mt18 { margin-top: 18px; } .mt22 { margin-top: 22px; }
.block { display: block; }
.line { border-bottom: 1px solid var(--line); }
.plain { border: 0; background: transparent; color: inherit; padding: 0; text-align: left; font: inherit; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 44px; }
.topbar-title { font-size: 15px; font-weight: 800; color: var(--white); text-align: center; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iconbtn { width: 44px; height: 44px; flex: 0 0 auto; border-radius: 14px; border: 0; background: var(--surface-2); color: var(--white); display: flex; align-items: center; justify-content: center; padding: 0; text-decoration: none; }
.iconbtn.sm { width: 38px; height: 38px; border-radius: 12px; }
.iconbtn:disabled { opacity: .35; }
.spacer44 { width: 44px; flex: 0 0 44px; }
.eyebrow { font: 700 14px/1.25 var(--display); letter-spacing: -0.01em; color: var(--white); }
.inline-ic { display: inline-flex; align-items: center; gap: 6px; }
.h1 { font: 800 25px/1.12 var(--display); letter-spacing: -0.02em; color: var(--white); text-wrap: balance; }
.h-big { font: 800 30px/1.05 var(--display); letter-spacing: -0.02em; color: var(--white); }
.sec { margin: 22px 0 0; font: 800 18px var(--display); color: var(--white); }
.lead { font-size: 15px; font-weight: 500; line-height: 1.45; color: var(--muted); }
.small { font-size: 13px; color: var(--muted); line-height: 1.45; }
.sub { font-size: 12px; color: var(--muted); }
.name { font-size: 15px; font-weight: 800; color: var(--white); }
.num { font-variant-numeric: tabular-nums; }
.card { box-sizing: border-box; border-radius: 22px; background: var(--surface); border: 1px solid var(--line); }
.card.is-turn { border: 2px solid var(--accent); }
.pad { padding: 14px 16px; }
.padrows { padding: 2px 14px; }
.dots { display: flex; gap: 6px; align-items: center; }
.dots span { width: 8px; height: 8px; border-radius: 999px; background: var(--line-2); }
.dots span.on { width: 24px; background: var(--accent); }
.tag { align-self: flex-start; min-height: 24px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; border: 0; color: inherit; }
.cta { width: 100%; height: 60px; box-sizing: border-box; border: 0; border-radius: 22px; background: var(--accent); color: var(--ink); font-size: 17px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18); text-decoration: none; }
.cta:active { transform: translateY(2px); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.cta:disabled { opacity: .4; }
.cta.mint { background: var(--mint); }
.cta-row { display: flex; gap: 10px; }
.cta-row .cta { flex: 1; }
.btn-dark { height: 60px; min-width: 60px; padding: 0 16px; box-sizing: border-box; border: 0; border-radius: 22px; background: var(--surface-2); color: var(--white); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); }
.btn-dark:disabled { opacity: .6; }
.btn-ghost { height: 52px; width: 100%; box-sizing: border-box; border-radius: 20px; border: 2px solid var(--line-2); background: transparent; color: var(--text); font-size: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn-ghost.danger { color: var(--danger); border-color: rgba(255,138,115,.4); }
.linkbtn { border: 0; background: transparent; padding: 0; min-height: 36px; color: var(--accent); font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
.opt { box-sizing: border-box; border: 3px solid var(--line); background: var(--surface); color: var(--white); text-align: left; font-family: inherit; }
.opt.is-sel { border-color: var(--accent); background: var(--sel); }
.opt:disabled { opacity: .4; }
.check { display: none; width: 24px; height: 24px; flex: 0 0 24px; border-radius: 999px; background: var(--accent); color: var(--ink); align-items: center; justify-content: center; }
.opt.is-sel .check { display: flex; }
/* guest form: tap a kind to add one, minus to take one away */
.qrow { display: flex; gap: 8px; align-items: stretch; }
.qrow-main { flex: 1 1 auto; min-width: 0; min-height: 64px; border-radius: 18px; padding: 10px 10px 10px 14px; gap: 10px; align-items: center; }
.qty { font: 900 32px/1 var(--display); color: var(--accent); letter-spacing: -0.03em; }
.qplus { width: 38px; height: 38px; flex: 0 0 38px; border-radius: 12px; background: var(--surface-2); color: var(--white); display: flex; align-items: center; justify-content: center; }
.opt.is-sel .qplus { background: var(--accent); color: var(--ink); }
.qplus.off { opacity: .3; }
.qminus { flex: 0 0 58px; width: 58px; border-radius: 18px; border: 3px solid var(--line-2); background: var(--surface); color: var(--white); display: flex; align-items: center; justify-content: center; padding: 0; }
.qminus:active { background: var(--sel); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-right: -20px; padding-right: 20px; }
.cat-row::-webkit-scrollbar { display: none; }
.cat-row .chip-btn { flex: 0 0 auto; }
.chip-btn { min-height: 40px; padding: 0 16px; box-sizing: border-box; border-radius: 999px; border: 2px solid var(--line-2); background: transparent; color: var(--text); font-size: 14px; font-weight: 800; display: inline-flex; align-items: center; gap: 8px; }
.chip-btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.chip-btn.is-sel { background: var(--accent); border-color: var(--accent); color: var(--ink); }
.person-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--surface-2); color: var(--white); font-size: 14px; font-weight: 800; border: 2px solid transparent; }
.person-chip .x { width: 26px; height: 26px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; padding: 0; margin-right: -6px; }
.person-chip.is-sel { border-color: var(--accent); background: var(--sel); }
.seg { display: grid; gap: 4px; padding: 4px; box-sizing: border-box; border-radius: 14px; background: var(--surface); height: 44px; }
.seg button { border: 0; border-radius: 10px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 800; }
.seg button.is-sel { background: var(--mint); color: var(--ink); }
.seg.pick button.is-sel { background: var(--surface-2); color: var(--white); }
.seg.pick button.is-sel.raus { background: var(--orange); color: var(--ink); }
.seg.pick button.is-sel.muss { background: var(--sun); color: var(--ink); }
.switch { width: 52px; height: 32px; flex: 0 0 52px; box-sizing: border-box; border-radius: 999px; border: 0; padding: 4px; background: var(--line-2); display: flex; align-items: center; }
.switch span { width: 24px; height: 24px; border-radius: 999px; background: var(--white); transition: transform .2s; }
.switch[aria-checked="true"] { background: var(--mint); }
.switch[aria-checked="true"] span { transform: translateX(20px); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper .val { min-width: 56px; text-align: center; font: 800 17px var(--display); color: var(--white); white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--muted); }
.input { box-sizing: border-box; width: 100%; height: 48px; border-radius: 14px; border: 2px solid var(--line-2); background: var(--surface); color: var(--white); padding: 0 14px; font: 700 16px var(--body); letter-spacing: 0; text-transform: none; outline-color: var(--accent); }
.input.area { height: 92px; padding: 12px 14px; resize: none; line-height: 1.4; }
.input.big { height: 64px; font: 800 26px var(--display); }
.input::placeholder { color: #7F78AE; font-weight: 600; }
.range { width: 100%; accent-color: var(--accent); height: 28px; }
.err { font-size: 13px; font-weight: 700; color: var(--danger); }
.radio, .checkbox { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 999px; border: 2px solid var(--line-2); background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
.checkbox { border-radius: 10px; }
.radio.is-sel, .checkbox.is-sel { background: var(--mint); border-color: var(--mint); }
.av { display: block; flex: 0 0 auto; border-radius: 999px; overflow: hidden; }
.av svg { display: block; width: 100%; height: 100%; }
.ini { flex: 0 0 auto; border-radius: 999px; color: var(--ink); font-weight: 800; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
.stackav { display: flex; }
.stackav > * + * { margin-left: -12px; }
.tile-ic { flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: var(--ink); box-shadow: inset 0 -3px 0 rgba(0,0,0,.16); }
.dash-ic { width: 56px; height: 56px; flex: 0 0 56px; box-sizing: border-box; border-radius: 999px; border: 2px dashed #5A5390; color: var(--accent); display: flex; align-items: center; justify-content: center; }
.live { display: inline-flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; box-sizing: border-box; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 800; letter-spacing: 0; color: var(--white); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.live i { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 999px; background: var(--mint); box-shadow: 0 0 0 4px rgba(72,217,166,.22); }
.dotlive { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 999px; }
.sock-chip { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px 0 5px; box-sizing: border-box; border-radius: 999px; background: var(--accent); color: var(--ink); font: 800 11px var(--display); box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; max-width: 230px; }
.sock-chip > span { width: 26px; height: 26px; flex: 0 0 26px; border-radius: 999px; background: var(--ink); display: flex; align-items: center; justify-content: center; }
.vsrow { position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.vs { position: absolute; left: 50%; top: 18px; margin-left: -22px; width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; background: var(--accent); border: 4px solid var(--ink); color: var(--ink); font: 900 12px var(--display); display: flex; align-items: center; justify-content: center; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; display: block; }
.bar b { display: block; height: 100%; border-radius: 999px; background: var(--mint); }
.prog { position: relative; height: 10px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.prog b { display: block; height: 100%; border-radius: 999px; background: var(--mint); transition: width .35s ease; }
.pilot-bar { position: relative; height: 10px; border-radius: 999px; background: var(--surface-2); overflow: visible; }
.pilot-bar b { display: block; height: 100%; border-radius: 999px; background: var(--mint); }
.pilot-bar i { position: absolute; top: -4px; width: 3px; height: 18px; margin-left: -1.5px; border-radius: 2px; background: var(--white); }
.done-badge { height: 24px; padding: 0 10px; border-radius: 999px; background: var(--mint); color: var(--ink); font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap; }
.bigcard { position: relative; overflow: hidden; box-sizing: border-box; border-radius: 30px; padding: 22px; color: var(--ink); box-shadow: inset 0 -8px 0 rgba(0,0,0,.14); }
.bigcard h2 { position: relative; font: 800 21px/1.22 var(--display); letter-spacing: -0.01em; text-wrap: balance; }
.bigcard .badge { position: relative; align-self: flex-start; min-height: 26px; padding: 3px 10px; box-sizing: border-box; border-radius: 999px; background: var(--ink); color: var(--white); font-size: 11px; font-weight: 800; letter-spacing: 0; display: inline-flex; align-items: center; }
.empty { padding: 18px; border-radius: 20px; border: 2px dashed var(--line-2); color: var(--muted); font-size: 14px; line-height: 1.45; text-align: center; }
.confirm { padding: 14px; border-radius: 18px; background: rgba(255,138,115,.1); border: 1px solid rgba(255,138,115,.35); }
.testbanner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255,201,64,.12); border: 1px solid rgba(255,201,64,.35); color: var(--sun); font-size: 12px; font-weight: 700; line-height: 1.35; }
.toast { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); max-width: 300px; padding: 12px 18px; border-radius: 16px; background: var(--white); color: var(--ink); font-size: 14px; font-weight: 800; text-align: center; box-shadow: 0 12px 30px rgba(0,0,0,.4); z-index: 20; animation: toastIn .25s ease; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
.logrow { display: flex; align-items: center; gap: 12px; min-height: 50px; }
.logrow + .logrow { border-top: 1px solid var(--line); }
.res { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.res + .res { border-top: 1px solid var(--line); }
.res .tag { align-self: center; }
.vote-row { display: flex; align-items: center; gap: 12px; min-height: 64px; }
.vote-row + .vote-row { border-top: 1px solid var(--line); }
.dice { width: 64px; height: 64px; flex: 0 0 64px; border-radius: 18px; background: var(--white); color: var(--ink); font: 900 30px var(--display); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 -5px 0 rgba(0,0,0,.14); animation: pop .45s ease; }
@keyframes pop { 0% { transform: scale(.4) rotate(-30deg); } 70% { transform: scale(1.1) rotate(6deg); } 100% { transform: scale(1) rotate(0); } }
.bidnum { font: 900 64px/1 var(--display); color: var(--white); }
.qr { position: relative; width: 126px; height: 126px; display: grid; grid-template-columns: repeat(21, minmax(0, 1fr)); }
.qr span { display: block; }
.qr > span:last-child { left: 46px !important; top: 46px !important; width: 34px !important; height: 34px !important; }
.linktext { font-size: 13px; font-weight: 700; color: var(--white); word-break: break-all; line-height: 1.35; }

/* home */
.welcome-hero { position: relative; height: 260px; border-radius: 32px; background: var(--accent); overflow: hidden; box-shadow: inset 0 -8px 0 rgba(0,0,0,.16); }
.hero { position: relative; overflow: hidden; min-height: 270px; box-sizing: border-box; border-radius: 32px; background: var(--accent); padding: 100px 22px 22px; display: flex; flex-direction: column; justify-content: flex-end; box-shadow: inset 0 -8px 0 rgba(0,0,0,.16); color: var(--ink); }
.hero h2 { position: relative; font: 900 28px/1.04 var(--display); letter-spacing: -0.03em; max-width: 200px; overflow-wrap: anywhere; }
.hero p { position: relative; margin-top: 8px; font-size: 14px; font-weight: 700; max-width: 200px; }
.hero-faces { position: absolute; right: 16px; top: 64px; display: flex; }
.play { position: relative; margin-top: 16px; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; padding: 0 20px 0 7px; border-radius: 999px; border: 0; background: var(--ink); color: var(--white); font-weight: 800; font-size: 15px; }
.play > span { width: 38px; height: 38px; border-radius: 999px; background: var(--accent); color: var(--ink); display: flex; align-items: center; justify-content: center; }
.games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.gtile { height: 140px; box-sizing: border-box; border-radius: 24px; border: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 4px; padding: 14px; color: var(--ink); text-align: left; box-shadow: inset 0 -6px 0 rgba(0,0,0,.16); }
.gtile:disabled { opacity: .45; }
.gtile b { position: relative; font: 800 14px/1.15 var(--display); }
.gtile small { position: relative; font-size: 12px; font-weight: 700; }
.gtile .art { position: absolute; }
.stat { padding: 12px 14px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; }
.stat b { font: 800 24px var(--display); color: var(--white); }
.stat span { font-size: 13px; font-weight: 700; color: var(--text); }
.stat small { font-size: 12px; color: var(--muted); }
.tabbar { height: 68px; box-sizing: border-box; border-radius: 24px; background: #221E40; border: 1px solid #343061; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
.tab { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 76px; padding: 8px 0; border: 0; border-radius: 18px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; }
.tab.on { background: var(--surface-2); color: var(--accent); }
.badge-dot { position: absolute; top: -6px; right: -10px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 999px; background: var(--accent); color: var(--ink); font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
.game-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 8px 0; box-sizing: border-box; color: var(--muted); }

.t-lever { position: absolute; right: -24px; top: 96px; width: 22px; height: 92px; transform-origin: 50% 100%; animation: tLever 8s .35s infinite both; }

.btn-dark.suggest, .cta.suggest { box-shadow: 0 0 0 3px var(--sun), inset 0 -6px 0 rgba(0,0,0,.2); }
/* Handicap-Station */
.hc-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 12px; }
.hc-who { font-size: 11px; font-weight: 800; color: var(--muted); }
.hc-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 4px; border-radius: 99px; background: rgba(152,134,255,.2); border: 1.5px solid rgba(152,134,255,.7); color: var(--white); font-size: 12.5px; white-space: nowrap; max-width: 100%; }
.hc-chip b { font-weight: 800; overflow: hidden; text-overflow: ellipsis; }
.hc-chip.atem, .hc-chip.tausch { background: rgba(72,217,166,.18); border-color: rgba(72,217,166,.7); }
.hc-chip.vollgas { background: rgba(255,122,69,.2); border-color: rgba(255,122,69,.75); }
.hc-e { width: 24px; height: 24px; border-radius: 50%; background: #F4F1FF; display: grid; place-items: center; flex: 0 0 auto; }

.hc-time { font: 800 12px var(--display); color: var(--sun); }

.hc-card { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 22px; border: 3px solid var(--line-2); background: var(--surface); color: var(--text); text-align: left; transition: transform .15s; }

.hc-card small { align-self: flex-start; padding: 2px 8px; border-radius: 99px; background: var(--mint); color: #15122B; font: 800 10.5px var(--display); text-transform: uppercase; letter-spacing: .05em; }
.hc-card.vollgas small { background: var(--orange); }
.hc-card.is-sel { border-color: var(--violet); background: linear-gradient(150deg, rgba(152,134,255,.28), rgba(255,143,196,.14)); transform: scale(1.02); }
.hc-ce { flex: 0 0 auto; width: 56px; height: 56px; border-radius: 18px; background: #F4F1FF; display: grid; place-items: center; border: 2.5px solid #15122B; }
.hc-big { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 20px 22px; border-radius: 30px; text-align: center; background: radial-gradient(70% 70% at 50% 30%, rgba(255,255,255,.35), transparent 70%), linear-gradient(160deg, #B3A6FF, #FF8FC4); color: #15122B; box-shadow: inset 0 -8px 0 rgba(0,0,0,.14); animation: roleIn .7s cubic-bezier(.2,1.4,.4,1) both; }
.hc-be { width: 104px; height: 104px; border-radius: 30px; background: #FFFFFF; border: 4px solid #15122B; display: grid; place-items: center; box-shadow: 0 8px 0 rgba(21,18,43,.25); animation: gwig .9s ease .5s; }
.hc-bl { font: 800 12px var(--display); letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
.hc-big b { font: 900 27px/1.1 var(--display); letter-spacing: -0.02em; }
.hc-big p { font-size: 15px; font-weight: 700; line-height: 1.42; max-width: 300px; }
.hc-bt { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: #15122B; color: var(--sun); font: 800 13px var(--display); }
.hc-free { width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 18px; border: 2px solid var(--mint); background: rgba(72,217,166,.14); color: var(--white); font: 800 14px var(--body); }
/* Lippenlesen */
.lipbox { width: 100%; margin-top: 10px; min-height: 120px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 18px; border-radius: 24px; border: 3px dashed var(--line-2); background: var(--surface); color: var(--text); text-align: center; }
.lipbox.open { border-style: solid; border-color: var(--pink); background: #FFFFFF; color: #15122B; }
.lipbox b { font: 900 22px/1.25 var(--display); letter-spacing: -0.01em; }
.lipbox small { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; color: #6B4FD8; }
.lipbox.open .sub { color: #6B6590; }
.lip-dots { font-size: 18px; letter-spacing: .12em; color: var(--muted); filter: blur(.6px); }
.terms { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

/* Gedankenleser */
.gl-head { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 22px; background: linear-gradient(135deg, rgba(255,143,196,.25), rgba(152,134,255,.18)); border: 1px solid rgba(255,143,196,.5); }
.gl-e { flex: 0 0 auto; width: 50px; height: 50px; border-radius: 16px; background: #FFFFFF; display: grid; place-items: center; }
.gl-l { font: 800 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--pink); }
.gl-c { font: 900 21px/1.15 var(--display); color: var(--white); }
.gl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.gl-t { min-height: 92px; padding: 10px; border-radius: 22px; border: 3px solid #15122B; background: #FFFFFF; color: #15122B; font: 800 17px/1.2 var(--display); box-shadow: 0 6px 0 rgba(0,0,0,.4); display: grid; place-items: center; text-align: center; }

.gl-pass { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 26px 16px; border-radius: 24px; background: var(--surface); border: 2px dashed var(--line-2); text-align: center; }

.gl-rev.ok { background: rgba(72,217,166,.18); border: 2px solid var(--mint); } .gl-rev.no { background: rgba(255,122,69,.16); border: 2px solid var(--orange); }
.gl-rev strong { font: 900 20px var(--display); margin-top: 4px; }
.gl-rev.ok strong { color: var(--mint); } .gl-rev.no strong { color: var(--orange); }
/* Ketchup-Montagsmaler */
.kc-score { display: flex; align-items: stretch; gap: 6px; }
.kc-team { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 18px; background: var(--surface); border: 2px solid var(--line); }
.kc-team.now { border-color: #FF5A2E; background: rgba(255,90,46,.12); }
.kc-team small { font: 800 10.5px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kc-team b { font-size: 13px; font-weight: 800; color: var(--white); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kc-team em { font: 900 28px var(--display); font-style: normal; color: var(--white); }
.kc-vs { align-self: center; font: 900 20px var(--display); color: var(--muted); font-style: normal; }
.kc-ready { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 22px 16px; border-radius: 26px; background: #FFFFFF; color: #15122B; text-align: center; box-shadow: 0 8px 0 rgba(0,0,0,.35); }

.kc-play { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 22px 16px 26px; border-radius: 28px; background: linear-gradient(160deg, #FF5A2E, #FF8FC4); color: #15122B; text-align: center; box-shadow: inset 0 -8px 0 rgba(0,0,0,.16); }
.kc-play.over { background: linear-gradient(160deg, #3A3463, #2C2750); color: var(--white); }
.kc-time { font: 900 26px var(--display); padding: 4px 14px; border-radius: 99px; background: #15122B; color: var(--sun); }
.kc-play small { margin-top: 10px; font: 800 12px var(--display); text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.kc-term { font: 900 38px/1.05 var(--display); letter-spacing: -0.03em; overflow-wrap: anywhere; }
/* Daumen-Blitz */
.bz-arena { position: relative; margin-top: 14px; height: 300px; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; background: #2C2750; border: 3px solid #15122B; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.bz-arena.solo { height: 220px; }
.bz-pad { flex: 1; border: 0; margin: 0; padding: 0; background: #3A3463; color: var(--white); font: 800 15px var(--display); display: flex; align-items: center; justify-content: center; transition: background .05s; }
.bz-pad.top span { transform: rotate(180deg); }
.bz-arena.st-wait .bz-pad { background: #FF7A45; }
.bz-arena.st-go .bz-pad { background: #48D9A6; color: #15122B; }
.bz-mid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 8px 16px; border-radius: 99px; background: #15122B; color: var(--white); font: 900 15px var(--display); white-space: nowrap; pointer-events: none; max-width: 90%; overflow: hidden; text-overflow: ellipsis; }
.bz-arena.solo .bz-mid { top: auto; bottom: 14px; transform: translateX(-50%); }
.bz-arena.st-go .bz-mid { color: var(--mint); font-size: 22px; }
.bz-list { display: flex; flex-wrap: wrap; gap: 6px; }
.bz-r { padding: 5px 10px; border-radius: 99px; background: var(--surface-2); font-size: 12.5px; font-weight: 800; color: var(--text); }
/* Löffel-Reflex */
.lr-score { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line); }
.lr-score span { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
.lr-score b { font-size: 13px; font-weight: 800; color: var(--white); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lr-score em { font: 900 30px var(--display); font-style: normal; color: var(--sun); }
.lr-score i { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: #F4F1FF; display: grid; place-items: center; font-style: normal; }
.lr-word { min-height: 150px; display: grid; place-items: center; padding: 14px; border-radius: 28px; background: #FFFFFF; color: #15122B; font: 900 40px/1.05 var(--display); letter-spacing: -0.03em; text-align: center; overflow-wrap: anywhere; box-shadow: 0 8px 0 rgba(0,0,0,.35); }
.lr-word.pop { animation: lrPop .35s cubic-bezier(.2,1.6,.4,1); }
.lr-word.grab { background: var(--mint); font-size: 48px; animation: lrPop .45s cubic-bezier(.2,1.8,.4,1); }
@keyframes lrPop { from { transform: scale(.7); opacity: .3; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .wh-over { display: none !important; } .wh-disc, .wh-res, .vs-side, .vs-burst, .vs-say, .konter-t i, .konter-up, .revcard, .hc-big, .hc-be, .gl-rev, .lr-word.pop, .lr-word.grab { animation: none !important; } .wh-res, .konter-up { opacity: 1; } .wh-disc { transform: rotate(var(--to)); } }
/* ===== bonus cards: the hidden button, the booster pack, the card ===== */
#gcta { position: relative; z-index: 2; }
.gdraw-wrap { position: relative; z-index: 1; height: 0; margin-top: -10px; transition: height .55s cubic-bezier(.2,1.3,.4,1), margin-top .55s cubic-bezier(.2,1.3,.4,1); }
.gdraw-wrap.on { height: 62px; margin-top: 0; }
.gdraw { position: absolute; left: 0; right: 0; top: 0; height: 62px; box-sizing: border-box; border: 0; border-radius: 22px; padding: 0 14px 0 14px; display: flex; align-items: center; gap: 12px; color: #FFFFFF; text-align: left; font-family: inherit; overflow: hidden; background: linear-gradient(110deg, #33257F 0%, #6A45E8 32%, #E0479E 66%, #FFB347 100%); background-size: 220% 100%; box-shadow: 0 12px 28px rgba(106,69,232,.45), inset 0 -5px 0 rgba(0,0,0,.22), inset 0 0 0 2px rgba(255,255,255,.2); transform: translateY(-66px) scale(.88); opacity: 0; pointer-events: none; transition: transform .55s cubic-bezier(.2,1.4,.4,1), opacity .3s; }
.gdraw.on { transform: none; opacity: 1; pointer-events: auto; animation: gdflow 5s ease-in-out infinite; }
.gdraw.pop { animation: gdpop .9s cubic-bezier(.2,1.5,.4,1) both, gdflow 5s ease-in-out .9s infinite; }
@keyframes gdpop { 0% { transform: translateY(-66px) scale(.8); opacity: 0; } 45% { transform: translateY(10px) scale(1.05); opacity: 1; } 70% { transform: translateY(-4px) scale(.98); } 100% { transform: none; opacity: 1; } }
@keyframes gdflow { 0%, 100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }
.gdraw b { display: block; font: 800 16px var(--display); letter-spacing: -0.01em; }
.gdraw small { display: block; font-size: 12px; font-weight: 700; opacity: .9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gd-pack { flex: 0 0 34px; display: flex; transform: rotate(-12deg); filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); animation: gdwig 2.8s ease-in-out infinite; }
@keyframes gdwig { 0%, 70%, 100% { transform: rotate(-12deg); } 76% { transform: rotate(6deg) scale(1.14); } 82% { transform: rotate(-18deg); } 88% { transform: rotate(4deg); } 94% { transform: rotate(-12deg); } }
.gd-n { flex: 0 0 auto; min-width: 42px; box-sizing: border-box; text-align: center; white-space: nowrap; padding: 5px 9px; border-radius: 12px; background: rgba(21,18,43,.42); font: 900 16px/1.2 var(--display); }
.gdraw > .stack, .gdraw > .gd-n { position: relative; z-index: 1; }
.gd-n.tick { animation: gdtick .7s cubic-bezier(.2,1.6,.4,1); }
@keyframes gdtick { 0% { transform: scale(1); background: rgba(21,18,43,.42); } 30% { transform: scale(1.35) rotate(-8deg); background: #FFC940; color: #15122B; } 100% { transform: none; } }
.gd-glint { position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.5) 50%, transparent 65%); background-size: 260% 100%; background-repeat: no-repeat; animation: gshine 3s ease-in-out infinite; pointer-events: none; }
.gdraw.charge { pointer-events: none; animation: gdflow 1.2s ease-in-out infinite, gdcharge .74s linear forwards; }
@keyframes gdcharge { 0% { transform: none; filter: brightness(1); } 10% { transform: translate(-1px, 0); } 20% { transform: translate(1px, -1px); } 30% { transform: translate(-1.5px, 1px) scale(1.01); } 40% { transform: translate(1.5px, 0) scale(1.01); } 50% { transform: translate(-2px, -1px) scale(1.015); filter: brightness(1.12); } 58% { transform: translate(2px, 1px) scale(1.02); } 66% { transform: translate(-2px, 0) scale(1.02); } 74% { transform: translate(2px, -1px) scale(1.025); filter: brightness(1.25); } 82% { transform: translate(-1.5px, 1px) scale(1.03); } 90% { transform: translate(1.5px, 0) scale(1.03); filter: brightness(1.4); box-shadow: 0 0 0 5px rgba(255,201,64,.45), 0 0 34px rgba(255,201,64,.85), inset 0 -5px 0 rgba(0,0,0,.22); } 100% { transform: scale(1.03); filter: brightness(1.5); box-shadow: 0 0 0 7px rgba(255,201,64,.3), 0 0 44px rgba(255,220,120,.95), inset 0 -5px 0 rgba(0,0,0,.22); } }
/* the charge fills the button from left to right */
.gdraw::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(90deg, rgba(255,226,140,0), rgba(255,226,140,.42) 82%, rgba(255,255,255,.9)); transform-origin: 0 50%; transform: scaleX(0); opacity: 0; pointer-events: none; }
.gdraw.charge::before { animation: gdfill .74s cubic-bezier(.55,0,.85,.6) forwards; }
@keyframes gdfill { 0% { transform: scaleX(0); opacity: 1; } 100% { transform: scaleX(1); opacity: 1; } }
.gdraw.charge .gd-pack { animation: gdpackq .74s linear forwards; }
@keyframes gdpackq { 0% { transform: rotate(-12deg); } 15% { transform: rotate(-4deg) scale(1.05); } 25% { transform: rotate(-16deg) scale(1.06); } 35% { transform: rotate(-2deg) scale(1.1); } 45% { transform: rotate(-18deg) scale(1.12); } 55% { transform: rotate(0) scale(1.16); } 63% { transform: rotate(-18deg) scale(1.18); } 71% { transform: rotate(2deg) scale(1.2); } 79% { transform: rotate(-16deg) scale(1.22); } 87% { transform: rotate(0) scale(1.24); } 100% { transform: rotate(0) scale(1.26); } }
/* spent: the pack has flown out, the glow settles */
.gdraw.launched { pointer-events: none; animation: gdflow 5s ease-in-out infinite, gdspent .6s ease forwards; }
@keyframes gdspent { from { transform: scale(1.03); filter: brightness(1.5); } to { transform: none; filter: brightness(.85) saturate(.8); } }
.gdraw.launched::before { opacity: 0; transform: scaleX(1); transition: opacity .5s; }
.gdraw.launched .gd-pack { opacity: 0; animation: none; }

.gk-ov { position: absolute; inset: 0; z-index: 20; overflow: hidden; color: var(--white); }
.gk-bg { position: absolute; inset: 0; background: radial-gradient(130% 70% at 50% 28%, color-mix(in srgb, var(--rc) 26%, #15122B) 0%, rgba(14,11,32,.96) 52%, rgba(8,6,18,.98) 100%); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }

.gk-scroll { position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto; box-sizing: border-box; padding: calc(var(--top) + 4px) var(--gx) calc(var(--bottom) + 18px); display: flex; flex-direction: column; align-items: center; }
.gk-stage { position: relative; flex: 0 0 392px; width: 100%; height: 392px; display: flex; align-items: center; justify-content: center; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.gk-raysw { position: absolute; left: 50%; top: 50%; width: 860px; height: 860px; margin: -430px 0 0 -430px; pointer-events: none; }
.gk-rays { width: 100%; height: 100%; border-radius: 50%; background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 70%, transparent) 0deg 6deg, transparent 6deg 18deg); -webkit-mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.55) 28%, transparent 58%); mask-image: radial-gradient(circle, #000 8%, rgba(0,0,0,.55) 28%, transparent 58%); opacity: .5; animation: gkspin 18s linear infinite; }
.r-leg .gk-rays { opacity: .72; }
.r-sel .gk-rays { opacity: .38; }
@keyframes gkspin { to { transform: rotate(360deg); } }
.gk-ov.gk-play .gk-raysw { animation: gkraysin .8s cubic-bezier(.2,1.2,.4,1) 1.5s both; }
@keyframes gkraysin { from { opacity: 0; transform: scale(.2) rotate(-40deg); } to { opacity: 1; transform: none; } }
.gk-glow { position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; margin: -190px 0 0 -190px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.9) 0%, color-mix(in srgb, var(--rc) 80%, transparent) 20%, color-mix(in srgb, var(--rc) 28%, transparent) 44%, transparent 68%); opacity: .55; pointer-events: none; animation: gkbreath 3s ease-in-out infinite; }
@keyframes gkbreath { 0%, 100% { transform: scale(.92); opacity: .5; } 50% { transform: scale(1.06); opacity: .72; } }
.gk-ov.gk-play .gk-glow { animation: gkcharge .85s ease-in .65s both, gkburst .9s ease-out 1.5s forwards, gkbreath 3s ease-in-out 2.4s infinite; }
@keyframes gkcharge { 0% { opacity: 0; transform: scale(.3); } 100% { opacity: .95; transform: scale(.9); } }
@keyframes gkburst { 0% { opacity: 1; transform: scale(.9); } 30% { opacity: 1; transform: scale(1.7); } 100% { opacity: .55; transform: scale(.95); } }

/* the pack: foil, sealed at both ends, a perforation to tear */
.gk-pack { position: absolute; left: 50%; top: 50%; width: 196px; height: 286px; margin: -143px 0 0 -98px; z-index: 3; pointer-events: none; }
.gk-ov.gk-play .gk-pack { animation: gkpackin .78s cubic-bezier(.2,1.25,.35,1) both, gkshake .8s ease-in .74s forwards; }
@keyframes gkpackin { 0% { transform: translateY(470px) scale(.3) rotate(-26deg); opacity: 0; } 25% { opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes gkshake { 0% { transform: none; } 10% { transform: translate(-2px, 1px) rotate(-1deg); } 20% { transform: translate(2px, -1px) rotate(1deg); } 30% { transform: translate(-3px, 2px) rotate(-1.5deg) scale(1.01); } 40% { transform: translate(4px, -2px) rotate(2deg) scale(1.02); } 50% { transform: translate(-5px, 2px) rotate(-2.5deg) scale(1.03); } 60% { transform: translate(6px, -3px) rotate(3deg) scale(1.04); } 70% { transform: translate(-7px, 3px) rotate(-3.5deg) scale(1.05); } 80% { transform: translate(8px, -2px) rotate(4deg) scale(1.06); } 90% { transform: translate(-9px, 2px) rotate(-4.5deg) scale(1.08); } 100% { transform: scale(1.1); } }
.gk-pack-top, .gk-pack-body { position: absolute; left: 0; right: 0; box-sizing: border-box; border: 4px solid var(--ink); background: linear-gradient(150deg, #FFF3B8 0%, #FFC940 18%, #FF7A45 40%, #E0479E 62%, #6A45E8 84%, #33257F 100%); background-size: 196px 286px; }
.gk-pack-top { top: 0; height: 54px; border-radius: 14px 14px 0 0; border-bottom: 0; transform-origin: 8% 100%; z-index: 2; }
.gk-pack-body { top: 54px; bottom: 0; border-radius: 0 0 14px 14px; border-top: 0; background-position: 0 -54px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding-bottom: 18px; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,.55); }
.gk-crimp { position: absolute; left: 0; right: 0; top: 0; height: 18px; border-radius: 10px 10px 0 0; background: repeating-linear-gradient(90deg, #F4F1FF 0 3px, #B9B2DA 3px 6px); border-bottom: 3px solid var(--ink); }
.gk-crimp.b { top: auto; bottom: 0; border-radius: 0 0 10px 10px; border-bottom: 0; border-top: 3px solid var(--ink); }
.gk-perf { position: absolute; left: 4px; right: 4px; bottom: -2px; border-bottom: 3px dashed rgba(21,18,43,.6); }
.gk-pack-logo { width: 82px; height: 82px; border-radius: 50%; background: #FFFFFF; border: 4px solid var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); transform: rotate(-8deg); }
.gk-pack-t { font: 900 34px/1 var(--display); letter-spacing: -0.03em; color: #FFFFFF; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); text-transform: uppercase; margin-top: 6px; }
.gk-pack-s { font: 800 9px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); background: rgba(255,255,255,.8); padding: 3px 8px; border-radius: 99px; }
.gk-pack-shine { position: absolute; inset: 0; background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.8) 45%, transparent 60%); background-size: 280% 100%; background-repeat: no-repeat; mix-blend-mode: overlay; animation: gholo 1.4s ease-in-out infinite; pointer-events: none; }
.gk-pack-st i { position: absolute; width: 14px; height: 14px; background: #FFFFFF; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); animation: gktw 1.2s ease-in-out infinite; }
.gk-pack-st i:nth-child(1) { left: 16px; top: 26px; }
.gk-pack-st i:nth-child(2) { right: 18px; top: 74px; animation-delay: .4s; }
.gk-pack-st i:nth-child(3) { left: 26px; bottom: 44px; animation-delay: .8s; }
@keyframes gktw { 0%, 100% { transform: scale(.3) rotate(0); opacity: .2; } 50% { transform: scale(1.2) rotate(90deg); opacity: 1; } }
.gk-ov.gk-play .gk-pack-top { animation: gktear .7s cubic-bezier(.3,.5,.4,1) 1.5s both; }
@keyframes gktear { 0% { transform: none; } 15% { transform: translate(4px, -8px) rotate(-5deg); } 100% { transform: translate(170px, -260px) rotate(62deg); opacity: 0; } }
.gk-ov.gk-play .gk-pack-body { animation: gkdrop .65s cubic-bezier(.55,0,.75,.2) 1.62s both; }
@keyframes gkdrop { 0% { transform: none; opacity: 1; } 100% { transform: translateY(300px) rotate(8deg) scale(.92); opacity: 0; } }

/* the burst */
.gk-flash { position: absolute; inset: 0; z-index: 8; pointer-events: none; background: radial-gradient(circle at 50% 30%, #FFFFFF 0%, color-mix(in srgb, var(--rc) 55%, white) 30%, transparent 72%); opacity: 0; animation: gkflash .6s ease-out 1.5s both; }
@keyframes gkflash { 0% { opacity: 0; } 10% { opacity: 1; } 100% { opacity: 0; } }
.gk-ring { position: absolute; left: 50%; top: 50%; width: 130px; height: 130px; margin: -65px 0 0 -65px; border-radius: 50%; border: 9px solid var(--rc); box-sizing: border-box; opacity: 0; pointer-events: none; z-index: 2; animation: gkring .8s cubic-bezier(.1,.7,.3,1) 1.52s both; }
.gk-ring.r2 { border-width: 4px; border-color: #FFFFFF; animation-delay: 1.64s; animation-duration: 1s; }
@keyframes gkring { 0% { transform: scale(.25); opacity: 1; } 100% { transform: scale(4.6); opacity: 0; } }
.gk-sparks, .gk-suck { position: absolute; left: 50%; top: 50%; width: 0; height: 0; z-index: 5; pointer-events: none; }
.gk-sparks i { position: absolute; left: -6px; top: -6px; width: 12px; height: 12px; border-radius: 50%; background: var(--rc); box-shadow: 0 0 12px var(--rc); opacity: 0; animation: gkspark 1s cubic-bezier(.12,.8,.3,1) calc(1.52s + var(--d)) both; }
.gk-sparks i.w { background: #FFFFFF; }
.gk-sparks i.st { left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 0; background: #FFFFFF; box-shadow: none; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
@keyframes gkspark { 0% { transform: translate(0, 0) scale(.3) rotate(0); opacity: 1; } 60% { opacity: 1; } 100% { transform: translate(var(--x), var(--y)) scale(.25) rotate(var(--r)); opacity: 0; } }
.gk-suck i { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 0 10px 2px var(--rc); opacity: 0; animation: gksuck .6s ease-in var(--d) both; }
@keyframes gksuck { 0% { transform: translate(var(--x), var(--y)) scale(1.5); opacity: 0; } 35% { opacity: 1; } 100% { transform: translate(0, 0) scale(.2); opacity: 0; } }

/* the card: back first, then it turns */
.gk-card { position: relative; z-index: 4; width: 252px; height: 356px; perspective: 1200px; --mx: 50%; }
.gk-ov.gk-play .gk-card { animation: gkrise .62s cubic-bezier(.2,1.25,.4,1) 1.64s both; }
@keyframes gkrise { 0% { transform: translateY(90px) scale(.4); opacity: 0; } 20% { opacity: 1; } 100% { transform: none; opacity: 1; } }
.gk-card.wig { animation: gkwig .5s ease; }
@keyframes gkwig { 0%, 100% { transform: none; } 25% { transform: rotate(-4deg) scale(1.04); } 60% { transform: rotate(3deg); } }
.gk-ov.gk-done .gk-card { animation: gkaway .46s cubic-bezier(.5,0,.8,.4) forwards; }
@keyframes gkaway { to { transform: translateY(470px) scale(.22) rotate(18deg); opacity: 0; } }
.gk-ov.gk-done .gk-bg, .gk-ov.gk-done .gk-panel, .gk-ov.gk-done .gk-raysw, .gk-ov.gk-done .gk-glow { animation: gkfadeout .42s ease forwards; }
@keyframes gkfadeout { to { opacity: 0; } }
.gk-tilt { width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .3s ease-out; }
.gk-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; animation: gkfloat 4.6s ease-in-out infinite; }
.gk-ov.gk-play .gk-inner { animation: gkflip .8s cubic-bezier(.3,1.35,.45,1) 2.22s both, gkfloat 4.6s ease-in-out 3.1s infinite; }
@keyframes gkflip { 0% { transform: rotateY(180deg); } 50% { transform: rotateY(70deg) scale(1.14); } 100% { transform: rotateY(0) scale(1); } }
@keyframes gkfloat { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-8px) rotate(.8deg); } }
.gk-face { position: absolute; inset: 0; border-radius: 22px; overflow: hidden; -webkit-backface-visibility: hidden; backface-visibility: hidden; box-shadow: 0 26px 60px rgba(0,0,0,.6); }
.gk-back { transform: rotateY(180deg); box-sizing: border-box; border: 6px solid var(--rc); background: radial-gradient(circle at 50% 40%, #5B43D6 0%, #2A1F66 55%, #15122B 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: var(--rc); }
.gk-back::before { content: ''; position: absolute; inset: 10px; border-radius: 12px; border: 2px dashed color-mix(in srgb, var(--rc) 60%, transparent); }
.gk-back b { font: 900 20px var(--display); color: #FFFFFF; letter-spacing: -0.02em; }
.gk-back small { font: 800 10px var(--display); letter-spacing: .14em; text-transform: uppercase; }
.gk-back-sk { display: flex; filter: drop-shadow(0 0 16px var(--rc)); transform: rotate(-12deg); }
.gk-front { padding: 8px; box-sizing: border-box; background: linear-gradient(145deg, var(--rc) 0%, #FFFFFF 22%, var(--rc) 46%, var(--rc2) 100%); }
.r-leg .gk-front { background: repeating-linear-gradient(135deg, #FFC940 0 40px, #FFF3B8 60px, #FF9A3D 100px, #FFC940 140px); animation: gkgold 2.4s linear infinite; }
@keyframes gkgold { from { background-position: 0 0; } to { background-position: 198px 0; } }
.gk-fin { position: relative; height: 100%; box-sizing: border-box; border-radius: 15px; border: 3px solid var(--ink); background: linear-gradient(180deg, #2E2766 0%, #1B1739 60%, #15122B 100%); display: flex; flex-direction: column; overflow: hidden; }
.gk-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 10px 0; }
.gk-rar { padding: 3px 9px; border-radius: 99px; background: var(--rc); color: var(--ink); font: 900 10px var(--display); letter-spacing: .1em; text-transform: uppercase; }
.gk-no { font: 800 10px var(--display); color: var(--muted); letter-spacing: .02em; }
.gk-art { position: relative; height: 140px; flex: 0 0 140px; display: flex; align-items: center; justify-content: center; }
.gk-art::before { content: ''; position: absolute; width: 122px; height: 122px; border-radius: 50%; background: radial-gradient(circle at 38% 32%, #FFFFFF 0%, var(--tc) 40%, color-mix(in srgb, var(--tc) 55%, #15122B) 100%); border: 4px solid var(--ink); box-shadow: 0 0 0 6px color-mix(in srgb, var(--rc) 40%, transparent), 0 10px 0 rgba(0,0,0,.3); }
.gk-art-ring { position: absolute; width: 150px; height: 150px; border-radius: 50%; border: 2px dashed color-mix(in srgb, var(--rc) 85%, transparent); animation: gkspin 14s linear infinite; }
.gk-art-c { position: relative; display: flex; filter: drop-shadow(0 4px 0 rgba(0,0,0,.25)); animation: gkbob 3s ease-in-out infinite; }
@keyframes gkbob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-5px) rotate(3deg); } }
.gk-txt { padding: 2px 14px 0; display: flex; flex-direction: column; gap: 5px; flex: 1 1 auto; text-align: center; }
.gk-txt small { font: 800 10px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--tc); }
.gk-txt b { font: 800 19px/1.16 var(--display); letter-spacing: -0.02em; color: #FFFFFF; text-wrap: balance; }
.gk-txt b.long { font-size: 16px; }
.gk-txt span { font-size: 12.5px; font-weight: 700; line-height: 1.35; color: var(--muted); text-wrap: balance; }
.gk-foot { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px 10px; border-top: 2px dashed rgba(255,255,255,.12); font: 800 11px var(--display); }
.gk-foot span:first-child { color: var(--sun); white-space: nowrap; }
.gk-foot span:last-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gk-holo { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; background: linear-gradient(115deg, transparent 28%, rgba(255,255,255,.5) 42%, rgba(152,134,255,.4) 48%, rgba(72,217,166,.35) 54%, rgba(255,201,64,.35) 60%, transparent 72%); background-size: 260% 100%; background-repeat: no-repeat; background-position: 160% 0; mix-blend-mode: screen; opacity: .4; animation: gholo 3.6s ease-in-out infinite; }
.gk-ov.gk-play .gk-holo { animation: gholo 3.6s ease-in-out 2.95s infinite; }
.gk-stamp { position: absolute; right: 12px; top: 112px; padding: 4px 10px; border: 3px solid var(--rc); border-radius: 10px; color: var(--rc); background: rgba(21,18,43,.8); font: 900 13px var(--display); letter-spacing: .1em; text-transform: uppercase; transform: rotate(-12deg); box-shadow: 0 0 18px color-mix(in srgb, var(--rc) 60%, transparent); pointer-events: none; }
.gk-ov.gk-play .gk-stamp { animation: gkstamp .5s cubic-bezier(.2,1.6,.4,1) 2.85s both; }
@keyframes gkstamp { 0% { transform: rotate(-26deg) scale(3.2); opacity: 0; } 60% { transform: rotate(-10deg) scale(.88); opacity: 1; } 100% { transform: rotate(-12deg) scale(1); opacity: 1; } }
.gk-ov.gk-play .gk-tilt { animation: gkthud .32s ease 3.02s; }
@keyframes gkthud { 0%, 100% { transform: none; } 40% { transform: translateY(5px) scale(.985); } }

/* what to fill in */
.gk-panel { position: relative; z-index: 6; width: 100%; max-width: 350px; margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.gk-ov.gk-play .gk-panel { animation: gkpanel .5s cubic-bezier(.2,1.2,.4,1) 3.05s both; }
@keyframes gkpanel { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
.gk-panel .field { color: var(--text); }
.gk-in.input.big { height: 62px; font: 800 22px var(--display); text-align: center; border-color: color-mix(in srgb, var(--rc) 70%, var(--line-2)); background: rgba(33,29,61,.9); }
.gk-in.area { min-height: 84px; font-size: 17px; font-weight: 700; border-color: color-mix(in srgb, var(--rc) 70%, var(--line-2)); background: rgba(33,29,61,.9); }
.gk-go.mint { animation: gpulse .9s ease 1; }
.gk-later { align-self: center; border: 0; background: none; color: var(--muted); font: 700 14px var(--body); padding: 6px 12px; text-decoration: underline; text-underline-offset: 3px; }
.gk-hint { text-align: center; font-size: 13px; font-weight: 700; color: var(--muted); margin: 0; }
.gk-ov.gk-drawmode .gk-stage { display: none; }
.gk-ov.gk-drawmode .gk-panel { margin-top: 4px; max-width: 360px; animation: gkpanel .45s cubic-bezier(.2,1.2,.4,1) both; }
.gk-dhead { display: flex; align-items: center; gap: 10px; }
.gk-dhead-e { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 14px; background: var(--tc); display: flex; align-items: center; justify-content: center; border: 3px solid var(--ink); box-sizing: border-box; }
.gk-dhead b { font: 800 19px var(--display); color: #FFFFFF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gk-dhead small { font-size: 12px; font-weight: 700; color: var(--muted); }
.gk-clock { position: relative; width: 54px; height: 54px; flex: 0 0 54px; display: grid; place-items: center; }
.gk-clock svg { position: absolute; inset: 0; }
.gk-clock b { position: relative; font: 900 18px var(--display); color: #FFFFFF; }
.gk-paper { position: relative; width: 100%; aspect-ratio: 1; border-radius: 22px; background: #FFFDF6; border: 5px solid var(--rc); box-sizing: border-box; overflow: hidden; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
.gk-paper canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.gk-paper.hurry { animation: gkhurry .5s ease-in-out infinite; }
@keyframes gkhurry { 0%, 100% { box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 0 rgba(255,90,46,0); } 50% { box-shadow: 0 18px 40px rgba(0,0,0,.45), 0 0 0 8px rgba(255,90,46,.5); } }
.gk-paper.over canvas { pointer-events: none; }
.gk-over { position: absolute; right: 12px; top: 12px; padding: 5px 12px; border-radius: 12px; border: 3px solid var(--orange); color: var(--orange); background: rgba(255,253,246,.92); font: 900 16px var(--display); text-transform: uppercase; letter-spacing: .04em; transform: rotate(8deg); animation: gkover .5s cubic-bezier(.2,1.6,.4,1) both; pointer-events: none; }
@keyframes gkover { 0% { transform: rotate(24deg) scale(3); opacity: 0; } 100% { transform: rotate(8deg) scale(1); opacity: 1; } }
.gk-pens { display: flex; justify-content: center; gap: 14px; }
.gk-pen { width: 38px; height: 38px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); background: var(--pc); padding: 0; transition: transform .2s; }
.gk-pen.on { border-color: #FFFFFF; transform: scale(1.18); box-shadow: 0 0 0 3px var(--pc); }

/* redeemed cards in the list */
.gk-mini { position: relative; margin-top: 12px; display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 10px; border-radius: 20px; background: linear-gradient(135deg, color-mix(in srgb, var(--rc) 22%, var(--surface)) 0%, var(--surface) 65%); border: 2px solid color-mix(in srgb, var(--rc) 70%, transparent); overflow: hidden; }
.gk-mini::after { content: ''; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.14) 48%, transparent 60%); background-size: 260% 100%; background-repeat: no-repeat; animation: gholo 4.2s ease-in-out infinite; pointer-events: none; }
.gk-mini-art { width: 56px; height: 74px; flex: 0 0 56px; box-sizing: border-box; border-radius: 10px; border: 3px solid var(--ink); background: linear-gradient(160deg, var(--rc), var(--rc2)); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.25); transform: rotate(-4deg); }
.gk-mini-art .gk-svg { border-radius: 6px; }
.gk-mini small { font: 800 10px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--rc); }
.gk-mini b { font: 800 15px var(--display); color: #FFFFFF; }
.gk-mini-t { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.gk-mini-p { font: 900 16px var(--display); color: var(--sun); }
.gk-mini.just { animation: gkminiin .8s cubic-bezier(.2,1.4,.4,1); }
@keyframes gkminiin { 0% { transform: translateY(-40px) scale(.7) rotate(-6deg); opacity: 0; } 60% { transform: translateY(4px) scale(1.03); opacity: 1; } 100% { transform: none; } }

/* Top-Antworten: the board */
.gb-board { position: relative; padding: 18px 12px 14px; border-radius: 24px; background: linear-gradient(180deg, #24308A 0%, #161A5C 100%); border: 4px solid var(--sun); box-shadow: 0 0 0 4px var(--ink), 0 16px 36px rgba(0,0,0,.45), inset 0 0 30px rgba(0,0,0,.35); overflow: hidden; }
.gb-board::before, .gb-board::after { content: ''; position: absolute; left: 12px; right: 12px; height: 8px; background: radial-gradient(circle, #FFE58A 0 2.5px, transparent 3.5px) 0 0 / 16px 8px repeat-x; animation: gbblink 1.1s steps(2) infinite; pointer-events: none; }
.gb-board::before { top: 4px; }
.gb-board::after { bottom: 3px; animation-delay: .55s; }
@keyframes gbblink { 50% { opacity: .3; } }
.gb-q { text-align: center; margin: 4px 0 12px; display: flex; flex-direction: column; gap: 4px; }
.gb-q span { font: 800 10px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--sun); }
.gb-q b { font: 800 18px/1.2 var(--display); color: #FFFFFF; text-wrap: balance; }
.gb-rows { display: flex; flex-direction: column; gap: 7px; perspective: 600px; }
.gb-row { display: flex; align-items: center; gap: 10px; width: 100%; height: 48px; padding: 0 8px 0 6px; box-sizing: border-box; border-radius: 12px; border: 2px solid #4352C6; background: linear-gradient(180deg, #3243B8 0%, #24318F 100%); color: #FFFFFF; text-align: left; font-family: inherit; box-shadow: inset 0 -4px 0 rgba(0,0,0,.25); }
.gb-row:disabled { opacity: 1; color: inherit; }
.gb-no { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 50%; display: grid; place-items: center; background: #161A5C; border: 2px solid var(--sun); color: var(--sun); font: 900 15px var(--display); }
.gb-ans { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gb-ans b { font: 800 16px var(--display); text-transform: uppercase; letter-spacing: .02em; }
.gb-ans i { font-style: normal; font-size: 13px; font-weight: 700; color: rgba(255,255,255,.5); }
.gb-cnt { flex: 0 0 44px; height: 32px; border-radius: 8px; display: grid; place-items: center; background: rgba(0,0,0,.25); font: 900 17px var(--display); color: var(--sun); }
.gb-row.hit { background: linear-gradient(180deg, #FFE07A 0%, #FFC940 100%); border-color: #FFF0A8; color: var(--ink); }
.gb-row.hit .gb-no { background: var(--ink); }
.gb-row.hit .gb-cnt { background: var(--ink); color: var(--sun); }
.gb-row.miss { background: linear-gradient(180deg, #3A2E6E 0%, #2A2256 100%); border-color: #4A3E86; color: rgba(255,255,255,.72); }
.gb-row.miss .gb-cnt { color: rgba(255,255,255,.6); }
.gb-row.just { animation: gbflip .6s cubic-bezier(.3,1.4,.5,1); }
@keyframes gbflip { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.gb-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; }
.gb-score { font-size: 13px; font-weight: 800; color: rgba(255,255,255,.82); }
.gb-xs { display: flex; gap: 6px; }
.gb-x { width: 34px; height: 34px; box-sizing: border-box; border-radius: 10px; display: grid; place-items: center; border: 2px solid rgba(255,255,255,.2); color: rgba(255,255,255,.2); }
.gb-x.on { background: #E5322D; border-color: #FF8A73; color: #FFFFFF; }
.gb-x.fresh { animation: gpillin .4s cubic-bezier(.2,1.6,.4,1); }
.gb-bigx { position: absolute; inset: 0; display: grid; place-items: center; color: #FF3B30; pointer-events: none; animation: gbx .9s ease forwards; filter: drop-shadow(0 6px 0 rgba(0,0,0,.45)); }
@keyframes gbx { 0% { transform: scale(2.4); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 70% { opacity: 1; } 100% { transform: scale(1.05); opacity: 0; } }
.gb-spy { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 2px solid var(--line-2); background: transparent; color: var(--text); font: 800 13px var(--body); }
.gb-spy.on { background: var(--sun); border-color: var(--sun); color: var(--ink); }

/* Sprüche-Klopfer and the gallery */
.gj-card { position: relative; padding: 18px 16px 16px; border-radius: 22px; background: linear-gradient(160deg, #FFB3AA 0%, #FF8FC4 100%); color: var(--ink); text-align: center; border: 3px solid var(--ink); box-shadow: 0 10px 0 rgba(0,0,0,.25); display: flex; flex-direction: column; align-items: center; }
.gj-l { font: 800 11px var(--display); letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.gj-q { margin: 10px 0 10px; font: 900 24px/1.2 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
.gj-card.open .gj-q { animation: gjopen .5s cubic-bezier(.2,1.4,.4,1); }
